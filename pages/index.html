<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Viva ai</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <link href="css/style.css" rel="style.css">
        <script src="js/app.js" defer></script>
        <script src="js/dados.js" defer></script>
    </head>

    <body>

        <header>

            <div id="logo">
                <h1>Viva Ai</h1>
                <img src="">
            </div>

            <nav id="menu">
                <ul class="menu-navegacao">
                    <li>Inicio</li>
                    <li>Agenda</li>
                    <li>Favorito</li>
                    <li>Minhas reservas</li>
                </ul>
            </nav>

            <button>
                <i class="fa-solid fa-user" type="button"></i>
            </button>

        </header>
        
        <main>
            <section class="conteudo-principal">
                <div class="conteudo-titulo">
                    <h1>Viva Ai</h1>
                </div>

                <form>
                    <select id="categorias">
                        <option disabled selected>Categorias</option>
                        <option>Sociais</option>
                        <option>Culturais</option>
                        <option>Esportivos</option>
                        <option>Educacionais</option>
                        <option>Musicais</option>
                        <option>Tecnológicos</option>
                        <option>Religiosos</option>
                    </select>

                    <select id="data">
                        <option disabled selected>Data</option>
                        <option>Todas as datas</option>
                        <option>Hoje</option>
                        <option>Esta semana</option>
                        <option>Este fim de semana</option>
                        <option>Este mês</option>
                        <!--<option>Escolher data</option>-->
                    </select>

                    <label>
                        <input placeholder="Pesquisa" type="text" id="pesquisa">
                        <button type="submit" id="btn-pesquisa">Pesquisar</button>
                    </label>

                </form>
            </section>

            <article>
                <div class="banner-novo1">
                    <h5 class="data">19/10/2026</h5>
                    <h2 class="evento-novo">Musicais</h2>
                    <p class="local">Teatro Municipal</p>
                    <aside>
                        <img src="" alt="">
                    </aside>
                </div>

                <div class="banner-novo2">
                    <h5 class="data">20/10/2026</h5>
                    <h2 class="evento-novo">Culturais</h2>
                    <p class="local">Centro de Eventos</p>
                    <aside>
                        <img src="" alt="">
                    </aside>
                </div>
                
                <div class="banner-novo3">
                    <h5 class="data">21/10/2026</h5>
                    <h2 class="evento-novo">Esportivos</h2>
                    <p class="local">Estádio Municipal</p>
                    <aside>
                        <img src="" alt="">
                    </aside>
                </div>
                
                <div class="banner-novo4">
                    <h5 class="data">22/10/2026</h5>
                    <h2 class="evento-novo">Religiosos</h2>
                    <p class="local">Igreja da Comunidade</p>
                    <aside>
                        <img src="" alt="">
                    </aside>
                </div>                
            </article>

            <div class="conteudo-descricao">
            </div>
        </main>
    </body>

</html>
