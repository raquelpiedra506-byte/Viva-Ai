    <body>

        <header>

            <div id="logo">

                        <option>Este mês</option>

                    </select>

                    <label>
                        <input placeholder="Pesquisa" type="text" id="pesquisa">
                        <button type="submit" id="btn-pesquisa">Pesquisar</button>
                    </label>

                </form>
            </section>

            <article>
                <div class="banner-novo1">
                    <h3 class="data"></h3>
