<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Viva ai</title>
        <link href="css/style.css" rel="stylesheet">
        <script src="js/app.js" defer></script>
        <script src="js/dados.js" defer></script>
    </head>

    <body>

        <header>

            <div id="logo">
                <h1>Viva Ai</h1>
                <img src="">
            </div>

            <nav id="menu">
                <ul class="menu-navegacao">
                    <li>Inicio</li>
                    <li>Agenda</li>
                    <li>Favorito</li>
                    <li>Minhas reservas</li>
                </ul>
            </nav>

            <label>
                <button id="btn-login">Login</button>
            </label>

        </header>
        
        <main>
            <section class="conteudo-principal">
                <div class="conteudo-titulo">
                    <h1>Viva Ai</h1>
                </div>

                <form>
                    <select id="categorias">
                        <option disabled selected>Categorias</option>
                        <option>Sociais</option>
                        <option>Culturais</option>
                        <option>Esportivos</option>
                        <option>Educacionais</option>
                        <option>Musicais</option>
                        <option>Tecnológicos</option>
                        <option>Religiosos</option>
                    </select>

                    <select id="data">
                        <option disabled selected>Data</option>
                        <option>Todas as datas</option>
                        <option>Hoje</option>
                        <option>Esta semana</option>
                        <option>Este fim de semana</option>
                        <option>Este mês</option>
                        <!--<option>Escolher data</option>-->
                    </select>

                    <label>
                        <input placeholder="Pesquisa" type="text" id="pesquisa">
                        <button type="submit" id="btn-pesquisa">Pesquisar</button>
                    </label>

                </form>
            </section>

            <article>
                <div class="banner-novo1">
                    <h3 class="data"></h3>
                    <h2 class="evento-novo"></h2>
                    <p class="local"></p>
                    <aside>
                        <img src="" alt="">
                    </aside>
                </div>

                <div class="banner-novo2">
                    <h3 class="data"></h3>
                    <h2 class="evento-novo"></h2>
                    <p class="local"></p>
                    <aside>
                        <img src="" alt="">
                    </aside>
                </div>
                
                <div class="banner-novo3">
                    <h3 class="data"></h3>
                    <h2 class="evento-novo"></h2>
                    <p class="local"></p>
                    <aside>
                        <img src="" alt="">
                    </aside>
                </div>
                
                <div class="banner-novo4">
                    <h3 class="data"></h3>
                    <h2 class="evento-novo"></h2>
                    <p class="local"></p>
                    <aside>
                        <img src="" alt="">
                    </aside>
                </div>                
            </article>



        </main>
    </body>

</html>
